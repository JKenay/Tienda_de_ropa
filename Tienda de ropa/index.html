<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSENTIALS — Básicos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f9f9f9; color: #111; padding: 20px; max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #e5e5e5; }
    .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; }
    
    .hero { text-align: center; padding: 40px 0; }
    .hero h1 { font-size: 2rem; margin-bottom: 10px; font-weight: 400; }
    .hero img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 15px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee; text-align: center; }
    .card img { width: 100%; height: 260px; object-fit: cover; border-radius: 6px; }
    .card h3 { font-size: 1rem; margin: 12px 0 4px; }
    .card p { font-weight: bold; margin-bottom: 12px; }
    
    button { background: #111; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
    button:hover { opacity: 0.8; }
    
    footer { text-align: center; padding: 40px 0 20px; color: #777; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">ESSENTIALS</div>
    <button id="cart-btn">Carrito (0)</button>
  </header>

  <section class="hero">
    <h1>Menos piezas. Infinitas combinaciones.</h1>
    <img src="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=800" alt="Hero Portada">
  </section>

  <main class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="Camiseta">
      <h3>Camiseta Algodón</h3>
      <p>$35.00</p>
      <button class="add-btn">Agregar</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500" alt="Jean">
      <h3>Jean Recto</h3>
      <p>$75.00</p>
      <button class="add-btn">Agregar</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500" alt="Sobrecamisa">
      <h3>Sobrecamisa Verde</h3>
      <p>$89.00</p>
      <button class="add-btn">Agregar</button>
    </div>
  </main>

  <footer>
    <p>© 2026 ESSENTIALS — Tienda Minimalista</p>
  </footer>

  <script>
    let count = 0;
    const cartBtn = document.getElementById('cart-btn');

    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        count++;
        cartBtn.textContent = `Carrito (${count})`;
      });
    });
  </script>

</body>
</html>
