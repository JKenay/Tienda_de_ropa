<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSENTIALS — Catálogo de Productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado y Navegación Global -->
  <header>
    <div class="logo">ESSENTIALS</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="productos.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="blogs.html">Blogs</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <div class="auth-cart">
      <a href="login.html">Iniciar sesión</a> | 
      <a href="registro.html">Registrar usuario</a>
      <button id="cart-btn">Carrito (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main class="catalog-container">
    <h2>Catálogo de Productos</h2>
    
    <!-- Contenedor donde se cargarán los productos con JavaScript -->
    <div id="grid-productos" class="grid">
      <!-- Se llenará dinámicamente desde JS en la Iteración 2 -->
    </div>
  </main>

  <!-- Panel de Carro de compras -->
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3>Tu Carrito</h3>
      <button id="close-cart">&times;</button>
    </div>
    <div id="cart-items" class="cart-items">
      <p class="empty-msg">El carrito está vacío</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">Total: $<span id="cart-total">0.00</span></div>
      <button class="checkout-btn">Finalizar Compra</button>
    </div>
  </aside>

  <footer>
    <p>© 2026 ESSENTIALS — Tienda Minimalista</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
